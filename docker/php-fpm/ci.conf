; docker/php-fpm/www.conf
[www]

; Run as non-root user created in Dockerfile
user = laravel
group = laravel

; Listen on TCP port so nginx (in other container) can connect
listen = 0.0.0.0:9000
listen.backlog = 511

; Process manager: dynamic for typical dev setups
pm = dynamic

; Tunable values (dev defaults) - adjust for production
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; For ondemand alternative (uncomment if using ondemand)
; pm = ondemand
; pm.max_children = 20
; pm.process_idle_timeout = 10s

request_terminate_timeout = 120s
request_slowlog_timeout = 5s
slowlog = /var/www/application/logs/slow.log

clear_env = no

php_admin_value[memory_limit] = 512M
php_admin_flag[display_errors] = on
php_admin_value[error_log] = /proc/self/fd/2