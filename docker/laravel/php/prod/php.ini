; =============================================================================
; PHP Configuration for Laravel Production Environment
; Optimized for security and performance
; =============================================================================

[PHP]
; Error Handling - Minimal exposure in production
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; Resource Limits - Conservative for production
memory_limit = 256M
max_execution_time = 60
max_input_time = 60
max_input_vars = 3000

; File Uploads
post_max_size = 50M
upload_max_filesize = 50M
max_file_uploads = 10

; Security Settings
expose_php = Off
allow_url_fopen = On
allow_url_include = Off

; Session Configuration - Secure for production
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1
session.cookie_samesite = "Strict"
session.gc_probability = 1
session.gc_divisor = 1000
session.gc_maxlifetime = 1440
session.use_only_cookies = 1
session.name = PHPSESSID

; Timezone
date.timezone = "UTC"

; Realpath Cache - Optimized for production
realpath_cache_size = 4096K
realpath_cache_ttl = 7200

; Disable dangerous functions
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,curl_exec,curl_multi_exec,parse_ini_file,show_source,phpinfo

; Output Buffering
output_buffering = 4096

; Character Encoding
default_charset = "UTF-8"

; Assertions (disabled for production)
zend.assertions = -1
assert.active = 0

; Disable file info cache
file_uploads = On
