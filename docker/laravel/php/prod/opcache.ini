; =============================================================================
; OPcache Configuration for Laravel Production
; Fully optimized for maximum performance
; =============================================================================

[opcache]
opcache.enable = 1
opcache.enable_cli = 0

; Memory Settings
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000

; Performance Settings
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.fast_shutdown = 1
opcache.save_comments = 1
opcache.enable_file_override = 1

; Optimization Level
opcache.optimization_level = 0x7FFEBFFF

; File Cache (optional, for additional performance)
; opcache.file_cache = /tmp/opcache
; opcache.file_cache_only = 0

; JIT Compilation (PHP 8.0+)
; opcache.jit = tracing
; opcache.jit_buffer_size = 128M

; Preloading (optional, configure in your Laravel app)
; opcache.preload = /var/www/html/preload.php
; opcache.preload_user = appuser
