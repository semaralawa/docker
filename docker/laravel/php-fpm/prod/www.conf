; =============================================================================
; PHP-FPM Pool Configuration for Laravel Production
; Optimized for performance and security
; =============================================================================

[www]

; User and Group
user = appuser
group = appuser

; Listen Configuration
listen = 0.0.0.0:9000
listen.backlog = 1024
listen.owner = appuser
listen.group = appuser
listen.mode = 0660

; Process Manager Configuration - Optimized for production
pm = dynamic
pm.max_children = 50
pm.start_servers = 10
pm.min_spare_servers = 5
pm.max_spare_servers = 15
pm.max_requests = 1000
pm.process_idle_timeout = 10s

; Status and Ping (can be disabled in production if not monitored)
pm.status_path = /status
ping.path = /ping
ping.response = pong

; Timeouts
request_terminate_timeout = 60s
request_slowlog_timeout = 5s

; Logging
slowlog = /proc/self/fd/2
access.log = /proc/self/fd/2
catch_workers_output = yes
decorate_workers_output = no

; Environment Variables
clear_env = yes

; PHP Admin Values (Production)
php_admin_value[memory_limit] = 256M
php_admin_flag[display_errors] = off
php_admin_value[error_log] = /proc/self/fd/2
php_admin_value[error_reporting] = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Security - Strict function disabling
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,curl_exec,curl_multi_exec,parse_ini_file,show_source,phpinfo

; Emergency restart threshold
emergency_restart_threshold = 10
emergency_restart_interval = 1m
process_control_timeout = 10s
