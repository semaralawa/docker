; =============================================================================
; PHP Configuration for CodeIgniter 3 Development Environment
; =============================================================================

[PHP]
; Error Handling - Verbose for development
error_reporting = E_ALL
display_errors = On
display_startup_errors = On
log_errors = On
error_log = /proc/self/fd/2

; Resource Limits - Generous for development
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000

; File Uploads
post_max_size = 100M
upload_max_filesize = 100M
max_file_uploads = 20

; Security Settings
expose_php = Off
allow_url_fopen = On
allow_url_include = Off

; Session Configuration
session.cookie_httponly = 1
session.cookie_secure = 0
session.use_strict_mode = 1
session.cookie_samesite = "Lax"
session.gc_probability = 1
session.gc_divisor = 1000
session.gc_maxlifetime = 1440

; Timezone
date.timezone = "UTC"

; Realpath Cache
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Disable dangerous functions (minimal for dev)
disable_functions = exec,passthru,shell_exec,system,proc_open,popen

; Output Buffering
output_buffering = 4096

; Character Encoding
default_charset = "UTF-8"

; Assertions (enabled for development)
zend.assertions = 1
assert.active = 1

; Short open tags (CodeIgniter 3 compatibility)
short_open_tag = Off
