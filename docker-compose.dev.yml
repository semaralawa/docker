services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PHP_VERSION: "${PHP_VERSION:-7.4}"
        UID: "${LOCAL_UID:-1000}"
        GID: "${LOCAL_GID:-1000}"
    image: laravel_app:${PHP_VERSION:-7.4}
    container_name: laravel_app
    restart: unless-stopped
    working_dir: /var/www
    environment:
      - APP_ENV=local
      - APP_DEBUG=1
    volumes:
      - ./:/var/www:delegated
      - composer_cache:/home/laravel/.composer/cache
      - ./docker/php-fpm/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro
    networks:
      - laravel

  web:
    image: nginx:1.23-alpine
    container_name: laravel_web
    restart: unless-stopped
    ports:
      - "${APP_FWD_PORT:-8080}:80"
    volumes:
      - ./:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - laravel

  db:
    image: mysql:8.0
    container_name: laravel_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
      MYSQL_DATABASE: "${DB_DATABASE:-laravel}"
      MYSQL_USER: "${DB_USERNAME:-laravel}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "${DB_FWD_PORT:-3306}:3306"
    networks:
      - laravel

  redis:
    image: redis:6-alpine
    container_name: laravel_redis
    restart: unless-stopped
    ports:
      - "${REDIS_FWD_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - laravel

volumes:
  db_data:
  redis_data:
  composer_cache:

networks:
  laravel:
    driver: bridge