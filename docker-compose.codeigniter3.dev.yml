# =============================================================================
# Docker Compose Configuration for CodeIgniter 3 Development
# =============================================================================

version: '3.8'

services:
  # PHP-FPM Application Service
  app:
    build:
      context: .
      dockerfile: docker/codeigniter3/Dockerfile
      target: development
      args:
        PHP_VERSION: ${PHP_VERSION:-7.4}
        UID: ${LOCAL_UID:-1000}
        GID: ${LOCAL_GID:-1000}
    image: ${APP_NAME:-ci3}_app:${PHP_VERSION:-7.4}-dev
    container_name: ${APP_NAME:-ci3}_app_dev
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      - CI_ENV=development
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-ci3_db}
      - DB_USERNAME=${DB_USERNAME:-ci3_user}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      # Bind mount for live code reloading
      - ./:/var/www/html:delegated
      # Persistent composer cache
      - composer_cache:/home/appuser/.composer/cache
      # Named volume for vendor if using composer
      - vendor:/var/www/html/vendor
    networks:
      - app_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  # Nginx Web Server
  web:
    image: nginx:1.25-alpine
    container_name: ${APP_NAME:-ci3}_web_dev
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      # Read-only application files
      - ./:/var/www/html:ro
      # Nginx configuration
      - ./docker/codeigniter3/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      # Nginx logs
      - nginx_logs:/var/log/nginx
    networks:
      - app_network
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: ${APP_NAME:-ci3}_db_dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${DB_DATABASE:-ci3_db}
      MYSQL_USER: ${DB_USERNAME:-ci3_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_HOST: '%'
    volumes:
      - db_data:/var/lib/mysql
      # Custom MySQL configuration
      - ./docker/mysql/dev.cnf:/etc/mysql/conf.d/custom.cnf:ro
    ports:
      - "${DB_PORT:-3306}:3306"
    networks:
      - app_network
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ${APP_NAME:-ci3}_redis_dev
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redissecret}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Mailhog for email testing (Development only)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: ${APP_NAME:-ci3}_mailhog_dev
    restart: unless-stopped
    ports:
      - "${MAILHOG_PORT:-8025}:8025"
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
    networks:
      - app_network

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
  composer_cache:
    driver: local
  vendor:
    driver: local
  nginx_logs:
    driver: local

networks:
  app_network:
    driver: bridge
